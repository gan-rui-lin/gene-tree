{% extends "base.html" %}
{% block content %}
<h3 class="page-heading">分析查询</h3>

<div class="row g-3">
    {# Q1 配偶及子女 #}
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Q1 配偶及子女</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <select id="q1-member" class="form-select">
                            {% for m in members %}
                                <option value="{{ m.member_id }}">{{ m.member_id }} - {{ m.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-primary w-100" onclick="runQ1()">查询</button>
                    </div>
                </div>
                <div id="q1-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    {# Q3 平均寿命最长辈分 #}
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Q3 平均寿命最长辈分</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <select id="q3-genealogy" class="form-select">
                            {% for g in genealogies %}
                                <option value="{{ g.genealogy_id }}">{{ g.genealogy_id }} - {{ g.title }}（{{ g.surname }}）</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-primary w-100" onclick="runQ3()">查询</button>
                    </div>
                </div>
                <div id="q3-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    {# Q4 男性 > 50 且无配偶 #}
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Q4 男性 &gt; 50 且无配偶</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <select id="q4-genealogy" class="form-select">
                            {% for g in genealogies %}
                                <option value="{{ g.genealogy_id }}">{{ g.genealogy_id }} - {{ g.title }}（{{ g.surname }}）</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-primary w-100" onclick="runQ4()">查询</button>
                    </div>
                </div>
                <div id="q4-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    {# Q5 早于本代平均出生年 #}
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Q5 早于本代平均出生年</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <select id="q5-genealogy" class="form-select">
                            {% for g in genealogies %}
                                <option value="{{ g.genealogy_id }}">{{ g.genealogy_id }} - {{ g.title }}（{{ g.surname }}）</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-primary w-100" onclick="runQ5()">查询</button>
                    </div>
                </div>
                <div id="q5-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    {# Q6 亲缘路径 #}
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Q6 亲缘路径（SQL + BFS）</h5>
                <div class="row g-2">
                    <div class="col-md-4">
                        <select id="q6-id1" class="form-select">
                            {% for m in members %}
                                <option value="{{ m.member_id }}">{{ m.member_id }} - {{ m.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select id="q6-id2" class="form-select">
                            {% for m in members %}
                                <option value="{{ m.member_id }}">{{ m.member_id }} - {{ m.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-primary w-100" onclick="runQ6()">查询</button>
                    </div>
                </div>
                <div id="q6-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
function renderEmpty(msg) {
    return '<div class="text-center text-muted py-3">' + msg + '</div>';
}

function renderLoading() {
    return '<div class="skeleton-card" style="margin-top:0.5rem;">' +
        '<div class="skeleton skeleton-text medium"></div>' +
        '<div class="skeleton skeleton-text"></div>' +
        '<div class="skeleton skeleton-text short"></div>' +
        '</div>';
}

function renderError(msg) {
    return '<div class="alert alert-danger mb-0">' + msg + '</div>';
}

/* Render a key-value stat card */
function renderStatCard(label, value, sub) {
    var html = '<div class="row g-2">' +
        '<div class="col-md-4"><div class="card"><div class="card-body text-center">' +
        '<div class="text-muted small">' + label + '</div>' +
        '<div class="display-6">' + value + '</div>';
    if (sub) html += '<div class="small text-muted">' + sub + '</div>';
    html += '</div></div></div></div>';
    return html;
}

/* Render a data table */
function renderTable(items, columns) {
    if (!items || items.length === 0) return renderEmpty('暂无数据');

    var html = '<div class="table-responsive"><table class="table table-striped table-bordered align-middle mb-0 table-card"><thead><tr>';
    columns.forEach(function(col) {
        html += '<th>' + col.label + '</th>';
    });
    html += '</tr></thead><tbody>';
    items.forEach(function(item) {
        html += '<tr>';
        columns.forEach(function(col) {
            var val = item[col.key];
            html += '<td data-label="' + col.label + '">' + (val !== null && val !== undefined ? val : '-') + '</td>';
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
}

/* Render a path as a breadcrumb-style chain */
function renderPath(items) {
    if (!items || items.length === 0) return renderEmpty('未找到亲缘路径');

    var html = '<div class="d-flex flex-wrap align-items-center gap-1">';
    items.forEach(function(item, i) {
        if (i > 0) {
            var via = item.via || '';
            var arrow = via === 'child' ? '→ 子女 →' : via === 'parent' ? '→ 父母 →' : via === 'spouse' ? '→ 配偶 →' : '→';
            html += '<span class="badge text-bg-secondary">' + arrow + '</span>';
        }
        html += '<span class="node-label">' + item.member_id + ' - ' + item.name + '</span>';
    });
    html += '</div>';
    return html;
}

async function fetchAndRender(url, resultId, renderFn) {
    var container = document.getElementById(resultId);
    container.innerHTML = renderLoading();
    try {
        var res = await fetch(url, { credentials: 'same-origin' });
        if (!res.ok) {
            var err = await res.json().catch(function() { return {}; });
            container.innerHTML = renderError(err.error || '请求失败 (' + res.status + ')');
            return;
        }
        var data = await res.json();
        container.innerHTML = renderFn(data);
    } catch (e) {
        container.innerHTML = renderError('网络错误: ' + e.message);
    }
}

function runQ1() {
    var id = document.getElementById('q1-member').value;
    fetchAndRender('/analysis/spouse-children/' + id, 'q1-result', function(data) {
        var items = data.items || [];
        if (items.length === 0) return renderEmpty('该成员暂无配偶和子女记录');
        return renderTable(items, [
            { key: 'relation', label: '关系' },
            { key: 'member_id', label: 'ID' },
            { key: 'name', label: '姓名' },
            { key: 'gender', label: '性别' },
            { key: 'birth_year', label: '出生年' },
            { key: 'death_year', label: '去世年' }
        ]);
    });
}

function runQ3() {
    var id = document.getElementById('q3-genealogy').value;
    fetchAndRender('/analysis/longest-lifespan-generation?genealogy_id=' + id, 'q3-result', function(data) {
        if (!data || !data.generation) return renderEmpty('暂无数据');
        return renderStatCard(
            '第 ' + data.generation + ' 代',
            data.avg_lifespan.toFixed(1) + ' 年',
            '平均寿命最长的辈分'
        );
    });
}

function runQ4() {
    var id = document.getElementById('q4-genealogy').value;
    fetchAndRender('/analysis/unmarried-male-over-50?genealogy_id=' + id, 'q4-result', function(data) {
        var items = data.items || [];
        if (items.length === 0) return renderEmpty('无符合条件的成员');
        return '<div class="mb-2"><span class="badge text-bg-primary">' + items.length + ' 人</span></div>' +
            renderTable(items, [
                { key: 'member_id', label: 'ID' },
                { key: 'name', label: '姓名' },
                { key: 'gender', label: '性别' },
                { key: 'birth_year', label: '出生年' },
                { key: 'age', label: '年龄' }
            ]);
    });
}

function runQ5() {
    var id = document.getElementById('q5-genealogy').value;
    fetchAndRender('/analysis/early-born-members?genealogy_id=' + id, 'q5-result', function(data) {
        var items = data.items || [];
        if (items.length === 0) return renderEmpty('无符合条件的成员');
        return '<div class="mb-2"><span class="badge text-bg-primary">' + items.length + ' 人</span></div>' +
            renderTable(items, [
                { key: 'member_id', label: 'ID' },
                { key: 'name', label: '姓名' },
                { key: 'generation', label: '辈分' },
                { key: 'birth_year', label: '出生年' },
                { key: 'avg_birth_year', label: '本代平均出生年' }
            ]);
    });
}

function runQ6() {
    var id1 = document.getElementById('q6-id1').value;
    var id2 = document.getElementById('q6-id2').value;
    fetchAndRender('/relationship-sql?id1=' + id1 + '&id2=' + id2, 'q6-result', function(data) {
        var items = data.items || [];
        if (items.length === 0) return renderEmpty('未找到两人之间的亲缘路径');
        return '<div class="mb-2"><span class="badge text-bg-primary">路径长度: ' + items.length + '</span></div>' +
            renderPath(items);
    });
}
</script>
{% endblock %}
