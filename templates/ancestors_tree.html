{% extends "base.html" %}
{% block content %}
<h3 class="page-heading">树形展示（祖先结构）</h3>

{% if error %}
<div class="alert alert-warning">{{ error }}</div>
{% endif %}

<form class="row g-2 mb-3" method="get">
    <div class="col-md-4">
        <label class="form-label">选择族谱</label>
        <select name="genealogy_id" class="form-select">
            {% for genealogy in genealogies %}
                <option value="{{ genealogy.genealogy_id }}" {% if genealogy.genealogy_id == selected_genealogy_id %}selected{% endif %}>
                    {{ genealogy.genealogy_id }} - {{ genealogy.title }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">选择成员</label>
        <select name="member_id" class="form-select">
            {% for member in members %}
                <option value="{{ member.member_id }}" {% if member.member_id == selected_member_id %}selected{% endif %}>
                    {{ member.member_id }} - {{ member.name }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-outline-primary w-100">展示</button>
    </div>
</form>

<div id="tree-toolbar" class="tree-toolbar" style="display:none;">
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(false)">全部折叠</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(true)">全部展开</button>
    <span class="ms-2"><span class="branch-label branch-label-father">■ 父系</span></span>
    <span><span class="branch-label branch-label-mother">■ 母系</span></span>
</div>

<div id="tree-container" class="tree-container"></div>

<script>
const treeData = JSON.parse('{{ tree_json|escapejs }}');

function createNodeElement(node) {
    const li = document.createElement('li');
    const hasFather = !!node.father;
    const hasMother = !!node.mother;
    const hasParents = hasFather || hasMother;

    const span = document.createElement('span');
    span.className = 'node-label' + (hasParents ? ' collapsible' : '');
    span.textContent = node.member_id + ' - ' + node.name;

    if (hasParents) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'tree-children';
        const ul = document.createElement('ul');

        if (hasFather) {
            const fatherLi = document.createElement('li');
            fatherLi.className = 'branch-father';
            const label = document.createElement('span');
            label.className = 'branch-label branch-label-father';
            label.textContent = '父系';
            fatherLi.appendChild(label);

            const fatherUl = document.createElement('ul');
            fatherUl.appendChild(createNodeElement(node.father));
            fatherLi.appendChild(fatherUl);
            ul.appendChild(fatherLi);
        }

        if (hasMother) {
            const motherLi = document.createElement('li');
            motherLi.className = 'branch-mother';
            const label = document.createElement('span');
            label.className = 'branch-label branch-label-mother';
            label.textContent = '母系';
            motherLi.appendChild(label);

            const motherUl = document.createElement('ul');
            motherUl.appendChild(createNodeElement(node.mother));
            motherLi.appendChild(motherUl);
            ul.appendChild(motherLi);
        }

        childrenDiv.appendChild(ul);

        span.addEventListener('click', function() {
            span.classList.toggle('collapsed');
            childrenDiv.classList.toggle('hidden');
        });

        li.appendChild(span);
        li.appendChild(childrenDiv);
    } else {
        li.appendChild(span);
    }
    return li;
}

function toggleAll(expand) {
    document.querySelectorAll('.node-label.collapsible').forEach(function(el) {
        const childrenDiv = el.nextElementSibling;
        if (!childrenDiv) return;
        if (expand) {
            el.classList.remove('collapsed');
            childrenDiv.classList.remove('hidden');
        } else {
            el.classList.add('collapsed');
            childrenDiv.classList.add('hidden');
        }
    });
}

if (treeData && treeData.member_id) {
    document.getElementById('tree-toolbar').style.display = 'flex';
    const ul = document.createElement('ul');
    ul.appendChild(createNodeElement(treeData));
    document.getElementById('tree-container').appendChild(ul);
} else {
    document.getElementById('tree-container').innerHTML =
        '<div class="empty-state">' +
            '<div class="empty-state-icon">🌲</div>' +
            '<div class="empty-state-title">暂无祖先树数据</div>' +
            '<div class="empty-state-desc">请先在上方选择一位成员并点击「展示」，即可追溯其父系和母系祖先。</div>' +
        '</div>';
}
</script>
{% endblock %}
