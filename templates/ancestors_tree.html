{% extends "base.html" %}
{% block content %}
<h3 class="page-heading">树形展示（祖先结构）</h3>

{% if error %}
<div class="alert alert-warning">{{ error }}</div>
{% endif %}

<form class="row g-2 mb-3" method="get">
    <div class="col-md-4">
        <label class="form-label">选择族谱</label>
        <select name="genealogy_id" class="form-select">
            {% for genealogy in genealogies %}
                <option value="{{ genealogy.genealogy_id }}" {% if genealogy.genealogy_id == selected_genealogy_id %}selected{% endif %}>
                    {{ genealogy.genealogy_id }} - {{ genealogy.title }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">选择成员</label>
        <input type="hidden" name="member_id" id="member-id-input" value="{{ selected_member_id|default_if_none:'' }}">
        <input id="member-search-input" class="form-control" type="text" autocomplete="off" placeholder="输入成员姓名前缀搜索" value="{{ selected_member_label }}">
        <div id="member-search-results" class="list-group mt-1"></div>
        <div class="form-text">输入姓名前缀后，点击候选项自动填入成员编号。</div>
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-outline-primary w-100">展示</button>
    </div>
</form>

<div id="tree-toolbar" class="tree-toolbar" style="display:none;">
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(false)">全部折叠</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(true)">全部展开</button>
    <span class="ms-2"><span class="branch-label branch-label-father">■ 父系</span></span>
    <span><span class="branch-label branch-label-mother">■ 母系</span></span>
</div>

<div id="tree-container" class="tree-container"></div>

<script>
const formEl = document.querySelector('form[method="get"]');
const genealogySelectEl = document.querySelector('select[name="genealogy_id"]');
const memberIdInputEl = document.getElementById('member-id-input');
const memberSearchInputEl = document.getElementById('member-search-input');
const memberSearchResultsEl = document.getElementById('member-search-results');

let searchTimer = null;

function clearMemberSearchResults() {
    memberSearchResultsEl.innerHTML = '';
}

function selectMember(item) {
    memberIdInputEl.value = String(item.member_id);
    memberSearchInputEl.value = item.member_id + ' - ' + item.name;
    clearMemberSearchResults();
}

function renderMemberSearchResults(items) {
    if (!items || items.length === 0) {
        memberSearchResultsEl.innerHTML = '<div class="list-group-item text-muted">无匹配成员</div>';
        return;
    }
    memberSearchResultsEl.innerHTML = '';
    items.forEach(function(item) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'list-group-item list-group-item-action';
        button.textContent = item.member_id + ' - ' + item.name;
        button.addEventListener('click', function() {
            selectMember(item);
        });
        memberSearchResultsEl.appendChild(button);
    });
}

async function searchMembersByName(prefix) {
    const genealogyId = genealogySelectEl.value;
    const params = new URLSearchParams({
        genealogy_id: genealogyId,
        name: prefix,
        limit: '30',
    });
    const response = await fetch('/members?' + params.toString());
    if (!response.ok) {
        throw new Error('search_failed');
    }
    const payload = await response.json();
    renderMemberSearchResults(payload.items || []);
}

memberSearchInputEl.addEventListener('input', function() {
    const keyword = memberSearchInputEl.value.trim();
    memberIdInputEl.value = '';
    clearTimeout(searchTimer);
    if (!keyword) {
        clearMemberSearchResults();
        return;
    }
    searchTimer = setTimeout(function() {
        searchMembersByName(keyword).catch(function() {
            memberSearchResultsEl.innerHTML = '<div class="list-group-item text-danger">搜索失败</div>';
        });
    }, 180);
});

genealogySelectEl.addEventListener('change', function() {
    memberIdInputEl.value = '';
    memberSearchInputEl.value = '';
    clearMemberSearchResults();
});

formEl.addEventListener('submit', function(event) {
    if (!memberIdInputEl.value) {
        event.preventDefault();
        memberSearchResultsEl.innerHTML = '<div class="list-group-item text-danger">请先从候选中选择成员</div>';
    }
});

const treeData = JSON.parse('{{ tree_json|escapejs }}');

function createNodeElement(node) {
    const li = document.createElement('li');
    const hasFather = !!node.father;
    const hasMother = !!node.mother;
    const hasParents = hasFather || hasMother;

    const span = document.createElement('span');
    span.className = 'node-label' + (hasParents ? ' collapsible' : '');
    span.textContent = node.member_id + ' - ' + node.name;

    if (hasParents) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'tree-children';
        const ul = document.createElement('ul');

        if (hasFather) {
            const fatherLi = document.createElement('li');
            fatherLi.className = 'branch-father';
            const label = document.createElement('span');
            label.className = 'branch-label branch-label-father';
            label.textContent = '父系';
            fatherLi.appendChild(label);

            const fatherUl = document.createElement('ul');
            fatherUl.appendChild(createNodeElement(node.father));
            fatherLi.appendChild(fatherUl);
            ul.appendChild(fatherLi);
        }

        if (hasMother) {
            const motherLi = document.createElement('li');
            motherLi.className = 'branch-mother';
            const label = document.createElement('span');
            label.className = 'branch-label branch-label-mother';
            label.textContent = '母系';
            motherLi.appendChild(label);

            const motherUl = document.createElement('ul');
            motherUl.appendChild(createNodeElement(node.mother));
            motherLi.appendChild(motherUl);
            ul.appendChild(motherLi);
        }

        childrenDiv.appendChild(ul);

        span.addEventListener('click', function() {
            span.classList.toggle('collapsed');
            childrenDiv.classList.toggle('hidden');
        });

        li.appendChild(span);
        li.appendChild(childrenDiv);
    } else {
        li.appendChild(span);
    }
    return li;
}

function toggleAll(expand) {
    document.querySelectorAll('.node-label.collapsible').forEach(function(el) {
        const childrenDiv = el.nextElementSibling;
        if (!childrenDiv) return;
        if (expand) {
            el.classList.remove('collapsed');
            childrenDiv.classList.remove('hidden');
        } else {
            el.classList.add('collapsed');
            childrenDiv.classList.add('hidden');
        }
    });
}

if (treeData && treeData.member_id) {
    document.getElementById('tree-toolbar').style.display = 'flex';
    const ul = document.createElement('ul');
    ul.appendChild(createNodeElement(treeData));
    document.getElementById('tree-container').appendChild(ul);
} else {
    document.getElementById('tree-container').innerHTML =
        '<div class="empty-state">' +
            '<div class="empty-state-icon">🌲</div>' +
            '<div class="empty-state-title">暂无祖先树数据</div>' +
            '<div class="empty-state-desc">请先在上方选择一位成员并点击「展示」，即可追溯其父系和母系祖先。</div>' +
        '</div>';
}
</script>
{% endblock %}
