<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}族谱系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/site.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/members-page">族谱系统</a>
        <div class="navbar-nav">
            <a class="nav-link {% if request.path == '/dashboard-page' %}active{% endif %}" href="/dashboard-page">统计看板</a>
            <a class="nav-link {% if request.path == '/analysis-page' %}active{% endif %}" href="/analysis-page">分析查询</a>
            <a class="nav-link {% if request.path == '/members-page' %}active{% endif %}" href="/members-page">成员管理</a>
            <a class="nav-link {% if request.path == '/tree-page' %}active{% endif %}" href="/tree-page">树形展示</a>
            <a class="nav-link {% if request.path == '/ancestors-tree-page' %}active{% endif %}" href="/ancestors-tree-page">祖先树</a>
        </div>
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if request.user.is_authenticated %}
                <span class="text-white small">当前用户：{{ request.user.username }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">退出登录</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
