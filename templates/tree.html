{% extends "base.html" %}
{% block content %}
<h3 class="page-heading">树形展示（后代结构）</h3>

{% if error %}
<div class="alert alert-warning">{{ error }}</div>
{% endif %}

<form class="row g-2 mb-3" method="get">
    <div class="col-md-4">
        <label class="form-label">选择族谱</label>
        <select name="genealogy_id" class="form-select">
            {% for genealogy in genealogies %}
                <option value="{{ genealogy.genealogy_id }}" {% if genealogy.genealogy_id == selected_genealogy_id %}selected{% endif %}>
                    {{ genealogy.genealogy_id }} - {{ genealogy.title }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">选择成员</label>
        <select name="member_id" class="form-select">
            {% for member in members %}
                <option value="{{ member.member_id }}" {% if member.member_id == selected_member_id %}selected{% endif %}>
                    {{ member.member_id }} - {{ member.name }}
                </option>
            {% endfor %}
        </select>
        {% if members_truncated %}
        <div class="form-text">成员较多，当前仅显示 {{ members|length }} / {{ members_total }} 条，可直接修改 URL 的 member_id 参数访问指定成员。</div>
        {% endif %}
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-outline-primary w-100">展示</button>
    </div>
</form>

<div id="tree-toolbar" class="tree-toolbar" style="display:none;">
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(false)">全部折叠</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(true)">全部展开</button>
</div>

<div id="tree-container" class="tree-container"></div>

<script>
const rootData = JSON.parse('{{ root_json|escapejs }}');

async function loadChildren(memberId, ul, label) {
    label.classList.add('loading');
    try {
        const response = await fetch('/tree-children/' + memberId);
        if (!response.ok) {
            throw new Error('request_failed');
        }
        const payload = await response.json();
        ul.innerHTML = '';
        (payload.items || []).forEach(function(child) {
            ul.appendChild(createNodeElement(child));
        });
        label.dataset.loaded = '1';
    } catch (err) {
        ul.innerHTML = '<li><span class="node-label">加载失败</span></li>';
    } finally {
        label.classList.remove('loading');
    }
}

function createNodeElement(node) {
    const li = document.createElement('li');
    const hasChildren = !!node.has_children;

    const span = document.createElement('span');
    span.className = 'node-label' + (hasChildren ? ' collapsible collapsed' : '');
    span.textContent = node.member_id + ' - ' + node.name;
    span.dataset.memberId = String(node.member_id);
    span.dataset.loaded = '0';

    if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'tree-children hidden';
        const ul = document.createElement('ul');
        childrenDiv.appendChild(ul);

        span.addEventListener('click', async function() {
            const willExpand = span.classList.contains('collapsed');
            if (willExpand && span.dataset.loaded !== '1') {
                await loadChildren(node.member_id, ul, span);
            }
            span.classList.toggle('collapsed');
            childrenDiv.classList.toggle('hidden');
        });

        li.appendChild(span);
        li.appendChild(childrenDiv);
    } else {
        li.appendChild(span);
    }
    return li;
}

function toggleAll(expand) {
    document.querySelectorAll('.node-label.collapsible').forEach(function(el) {
        const childrenDiv = el.nextElementSibling;
        if (!childrenDiv) return;
        if (expand) {
            el.classList.remove('collapsed');
            childrenDiv.classList.remove('hidden');
        } else {
            el.classList.add('collapsed');
            childrenDiv.classList.add('hidden');
        }
    });
}

if (rootData && rootData.member_id) {
    document.getElementById('tree-toolbar').style.display = 'flex';
    const ul = document.createElement('ul');
    ul.appendChild(createNodeElement(rootData));
    document.getElementById('tree-container').appendChild(ul);
} else {
    document.getElementById('tree-container').innerHTML =
        '<div class="empty-state">' +
            '<div class="empty-state-icon">🌳</div>' +
            '<div class="empty-state-title">暂无树形数据</div>' +
            '<div class="empty-state-desc">请先在上方选择一位成员并点击「展示」，即可查看其后代树形结构。</div>' +
        '</div>';
}
</script>
{% endblock %}
